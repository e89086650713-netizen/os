.stk{padding:7px 0 24px}.ps{height:176px;border-radius:23px;padding:20px 18px;margin-top:-105px;box-shadow:0 -5px 18px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.35);background-image:linear-gradient(120deg,rgba(255,255,255,.22),transparent 42%,rgba(255,255,255,.08)),radial-gradient(circle at 90% 80%,rgba(255,255,255,.22),transparent 34%);}.ps:first-child{margin-top:0}.ps:after{content:'';position:absolute;width:180px;height:180px;border:28px solid rgba(255,255,255,.1);border-radius:50%;right:-65px;bottom:-95px;pointer-events:none}.ph{height:38px}.ph .lg{display:none}.ph b{font-size:21px;letter-spacing:-.45px}.pb{margin-top:24px;position:relative;z-index:1}.pb small{font-size:10px;letter-spacing:1px}.pb b{font-size:19px}.ps:nth-child(6n+1){background-color:#d92b24!important;color:white!important}.ps:nth-child(6n+2){background-color:#405ba7!important;color:white!important}.ps:nth-child(6n+3){background-color:#0875bd!important;color:white!important}.ps:nth-child(6n+4){background-color:#16a85a!important;color:white!important}.ps:nth-child(6n+5){background-color:#e87919!important;color:white!important}.ps:nth-child(6n){background-color:#565b68!important;color:white!important}
#docview{position:fixed;inset:0;z-index:60;background:#000;color:#f5f5f7;display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(105px + env(safe-area-inset-bottom,0px))}#docview .dvtop{height:56px;display:flex;align-items:center;justify-content:space-between;font-size:19px;font-weight:750}#docview .dvtop button{background:none;color:#8e9bb2;font-size:27px;padding:5px}#docview .passport{margin:18px 0 24px;border-radius:25px;overflow:hidden;background:#f5e8e8;color:#252630;min-height:480px;box-shadow:0 16px 42px rgba(0,0,0,.35)}#docview .passband{background:#a30e2b;color:white;text-align:center;padding:19px 12px;font-family:Georgia,serif;letter-spacing:2px;font-size:17px}#docview .passbody{padding:22px 20px 26px;position:relative}#docview .passbody:after{content:'✥';position:absolute;right:15px;bottom:15px;font-size:115px;color:rgba(160,20,45,.06);pointer-events:none}#docview .field{position:relative;z-index:1;margin:0 0 17px}#docview .field small{display:block;color:#5d6474;font-size:13px;margin-bottom:5px}#docview .field b{font-size:17px;line-height:1.35;overflow-wrap:anywhere}#docview .field button{padding:0;background:none;color:#1684ed;font-weight:750}#docview .docphoto{width:100%;border-radius:14px;margin-top:10px}#docview .present{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:68px;border-radius:18px;background:#087ff5;color:white;font-size:20px;font-weight:650;box-shadow:0 10px 28px rgba(0,100,255,.28)}

.flip-back{transform:rotateY(180deg)}
