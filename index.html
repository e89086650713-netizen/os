</style></head><body>
<div id="app"></div>
<div id="toast"><span id="tm"></span><button class="sm g" id="tu">Отменить</button></div>
<div id="sp" onclick="if(event.target===this)closeSp()"><div class="card"><input id="sq" placeholder="Поиск по задачам, расходам, заметкам…" oninput="doSearch()"><div id="sr"></div></div></div>
<nav id="nav"></nav>
<script>
const K='lifeos_proto_v1';
let S={tasks:[],tx:[],notes:[],habits:[],shop:[],theme:'auto'};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=()=>Math.random().toString(36).slice(2,10);
const ds=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=n=>new Intl.NumberFormat('ru-RU').format(Math.round(n))+' ₽';
const TODAY=()=>ds();
let tab='home',sub='tasks',ft='today',undo=null,tt;
const tabs=[['home','🏠','Главная'],['tasks','✅','Задачи'],['stats','📊','Аналитика'],['brain','🧠','Мозг'],['me','👤','Профиль']];
function go(t){tab=t;render();scrollTo(0,0)}
function toast(m,u){$('#tm').textContent=m;undo=u;$('#tu').style.display=u?'':'none';$('#toast').style.display='flex';clearTimeout(tt);tt=setTimeout(()=>$('#toast').style.display='none',5000)}
$('#tu').onclick=()=>{if(undo){undo();save();render()}$('#toast').style.display='none'};
function theme(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme)}
// ---- local rule-based parser (не AI)
const CATS=[['Авто',/бенз|заправ|авто|машин|масл/],['Продукты',/продукт|еда|магазин|молок|хлеб/],['Транспорт',/такси|метро|автобус|проезд/],['Дом',/квартир|ремонт|клей|плитк|коммун/],['Здоровье',/аптек|врач|лекарств/],['Развлечения',/кино|игр|кафе|ресторан/],['Инструменты',/инструмент|дрель/]];
function num(t){const m=t.replace(/(\d)\s(?=\d{3}\b)/g,'$1').match(/\d+([.,]\d+)?/);return m?parseFloat(m[0].replace(',','.')):null}
function quick(raw){const t=raw.trim();if(!t)return;const l=t.toLowerCase(),n=num(l);let m;
 if(n&&/потратил|заплатил|расход|купил.*за|оплатил/.test(l)){const c=(CATS.find(x=>x[1].test(l))||['Другое'])[0];const o={id:id(),type:'exp',amt:n,cat:c,date:TODAY(),note:t};S.tx.unshift(o);save();toast('Расход '+fmt(n)+' · '+c,()=>S.tx=S.tx.filter(x=>x.id!==o.id))}
 else if(n&&/заработал|получил|доход|зарплат|пришло/.test(l)){const o={id:id(),type:'inc',amt:n,cat:'Доход',date:TODAY(),note:t};S.tx.unshift(o);save();toast('Доход '+fmt(n),()=>S.tx=S.tx.filter(x=>x.id!==o.id))}
 else if(m=l.match(/^запомни[,:]?\s*(.+)/)){const o={id:id(),title:t.slice(t.length-m[1].length),body:'',date:TODAY(),fav:0};S.notes.unshift(o);save();toast('Заметка сохранена',()=>S.notes=S.notes.filter(x=>x.id!==o.id))}
 else if(m=l.match(/^(купить|купи)\s+(.+)/)){const items=t.slice(t.length-m[2].length).split(/,|\sи\s/).map(s=>s.trim()).filter(Boolean).map(s=>({id:id(),name:s[0].toUpperCase()+s.slice(1),done:0}));S.shop.push(...items);save();toast('В покупки: '+items.length+' шт.',()=>S.shop=S.shop.filter(x=>!items.includes(x)))}
 else{let d=TODAY();if(/завтра/.test(l)){const x=new Date();x.setDate(x.getDate()+1);d=ds(x)}const tm=l.match(/в\s(\d{1,2})(?::(\d\d))?/);const title=t.replace(/завтра|сегодня/ig,'').replace(/\s+/g,' ').trim()||t;const o={id:id(),title:title[0].toUpperCase()+title.slice(1),due:d,time:tm?String(tm[1]).padStart(2,'0')+':'+(tm[2]||'00'):'',done:0};S.tasks.unshift(o);save();toast('Задача на '+(d===TODAY()?'сегодня':'завтра')+(o.time?' в '+o.time:''),()=>S.tasks=S.tasks.filter(x=>x.id!==o.id))}
 render()}
function prefill(s){const i=$('#qi');i.value=s;i.focus()}
// ---- helpers
const todayTasks=()=>S.tasks.filter(t=>t.due<=TODAY());
function streak(h){let c=0;const d=new Date();if(!h.log[ds(d)])d.setDate(d.getDate()-1);while(h.log[ds(d)]){c++;d.setDate(d.getDate()-1)}return c}
const mon=()=>S.tx.filter(t=>t.date.slice(0,7)===TODAY().slice(0,7));
const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);
const bal=()=>sum(S.tx,'inc')-sum(S.tx,'exp');
function taskRow(t){return `<div class="item ${t.done?'done':''}"><button class="ck ${t.done?'on':''}" onclick="tg('${t.id}')">${t.done?'✓':''}</button><div class="t"><b>${esc(t.title)}</b><span>${t.due===TODAY()?'Сегодня':t.due}${t.time?' · '+t.time:''}${t.due<TODAY()&&!t.done?' · просрочено':''}</span></div><button class="x" onclick="rm('tasks','${t.id}')">×</button></div>`}
function tg(i){const t=S.tasks.find(x=>x.id===i);t.done=t.done?0:1;save();render()}
function rm(k,i){S[k]=S[k].filter(x=>x.id!==i);save();render()}
// ---- views
function home(){const h=new Date().getHours(),g=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
 const tt=todayTasks(),td=tt.filter(t=>t.done).length,hd=S.habits.filter(x=>x.log[TODAY()]).length;
 const nt=S.notes.slice(0,2);
 return `<div class="top"><div><h1>${g}</h1><p class="sub">${new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</p></div><button class="g sm" onclick="openSp()">🔍</button></div>
 <div class="card"><div class="row"><input id="qi" placeholder="«Потратил 850 на бензин», «Завтра в 9 купить клей»…" onkeydown="if(event.key==='Enter')qs()"><button onclick="qs()">→</button></div>
 <div class="chips"><button class="g sm" onclick="prefill('Завтра ')">＋ Задача</button><button class="g sm" onclick="prefill('Потратил  на ')">− Расход</button><button class="g sm" onclick="prefill('Заработал ')">＋ Доход</button><button class="g sm" onclick="prefill('Запомни, ')">📝 Заметка</button><button class="g sm" onclick="prefill('Купить ')">🛒 Покупка</button></div>
 <div class="lbl">Ввод разбирается локальными правилами, без внешнего AI.</div></div>
 <div class="grid"><div class="card" onclick="go('tasks')"><div class="lbl">Задачи</div><div class="big">${td}/${tt.length}</div></div><div class="card" onclick="go('stats')"><div class="lbl">Баланс</div><div class="big ${bal()<0?'neg':''}" style="font-size:16px">${fmt(bal())}</div></div><div class="card" onclick="sub='habits';go('tasks')"><div class="lbl">Привычки</div><div class="big">${hd}/${S.habits.length}</div></div></div>
 <h2>Ближайшие задачи</h2><div class="card">${tt.filter(t=>!t.done).slice(0,4).map(taskRow).join('')||'<div class="empty">На сегодня задач нет</div>'}</div>
 <h2>Последние заметки</h2><div class="card">${nt.map(n=>`<div class="item"><div class="t"><b>${esc(n.title)}</b><span>${n.date}</span></div></div>`).join('')||'<div class="empty">Заметок пока нет</div>'}</div>`}
function qs(){const i=$('#qi');quick(i.value)}
function tasksV(){const seg=`<div class="seg">${[['tasks','Задачи'],['habits','Привычки'],['shop','Покупки']].map(a=>`<button class="${sub===a[0]?'on':''}" onclick="sub='${a[0]}';render()">${a[1]}</button>`).join('')}</div>`;
 if(sub==='tasks'){const T=TODAY(),f={today:t=>!t.done&&t.due<=T,week:t=>!t.done,done:t=>t.done}[ft];const L=S.tasks.filter(f).sort((a,b)=>(a.due+a.time).localeCompare(b.due+b.time));
 return `<h1>Задачи</h1>${seg}<div class="card"><div class="row"><input id="ni" placeholder="Новая задача (можно «завтра в 9 …»)" onkeydown="if(event.key==='Enter')addT()"><button onclick="addT()">＋</button></div></div>
 <div class="seg">${[['today','Сегодня'],['week','Все'],['done','Готово']].map(a=>`<button class="${ft===a[0]?'on':''}" onclick="ft='${a[0]}';render()">${a[1]}</button>`).join('')}</div>
 <div class="card">${L.map(taskRow).join('')||'<div class="empty">Здесь пусто</div>'}</div>`}
 if(sub==='habits')return `<h1>Привычки</h1>${seg}<div class="card"><div class="row"><input id="hi" placeholder="Новая привычка" onkeydown="if(event.key==='Enter')addH()"><button onclick="addH()">＋</button></div></div>
 <div class="card">${S.habits.map(h=>{const w=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-6+k);return h.log[ds(d)]?1:0});return `<div class="item"><button class="ck ${h.log[TODAY()]?'on':''}" onclick="tgH('${h.id}')">${h.log[TODAY()]?'✓':''}</button><div class="t"><b>${esc(h.name)}</b><span>Серия: ${streak(h)} дн. · 7 дн: ${w.reduce((a,b)=>a+b)}/7 ${w.map(x=>x?'●':'○').join('')}</span></div><button class="x" onclick="rm('habits','${h.id}')">×</button></div>`}).join('')||'<div class="empty">Добавьте первую привычку</div>'}</div>`;
 const tot=S.shop.filter(x=>x.done).length;
 return `<h1>Покупки</h1>${seg}<div class="card"><div class="row"><input id="si" placeholder="Молоко, хлеб, яйца" onkeydown="if(event.key==='Enter')addS()"><button onclick="addS()">＋</button></div></div>
 <div class="card">${S.shop.map(s=>`<div class="item ${s.done?'done':''}"><button class="ck ${s.done?'on':''}" onclick="tgS('${s.id}')">${s.done?'✓':''}</button><div class="t"><b>${esc(s.name)}</b></div><button class="x" onclick="rm('shop','${s.id}')">×</button></div>`).join('')||'<div class="empty">Список пуст</div>'}${S.shop.length?`<div class="row" style="margin-top:8px"><span class="lbl" style="flex:1">Куплено ${tot} из ${S.shop.length}</span><button class="g sm" onclick="S.shop=S.shop.filter(x=>!x.done);save();render()">Убрать купленное</button></div>`:''}</div>`}
function addT(){quick($('#ni').value.replace(/^(?=купить|купи|запомни|потратил|заработал)/i,'задача: ')) }
function addH(){const v=$('#hi').value.trim();if(!v)return;S.habits.push({id:id(),name:v,log:{}});save();render()}
function tgH(i){const h=S.habits.find(x=>x.id===i);h.log[TODAY()]?delete h.log[TODAY()]:h.log[TODAY()]=1;save();render()}
function addS(){const v=$('#si').value.trim();if(!v)return;quick('купить '+v)}
function tgS(i){const s=S.shop.find(x=>x.id===i);s.done=s.done?0:1;save();render()}
function statsV(){const M=mon(),ex=M.filter(t=>t.type==='exp'),by={};ex.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=cats[0]?cats[0][1]:1,te=sum(M,'exp');
 const days=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-6+k);const s=ds(d);return [d.toLocaleDateString('ru-RU',{weekday:'short'}),S.tx.filter(t=>t.date===s&&t.type==='exp').reduce((a,b)=>a+b.amt,0)]}),dm=Math.max(1,...days.map(d=>d[1]));
 const done=S.tasks.filter(t=>t.done).length;
 return `<h1>Аналитика</h1><p class="sub">Только реальные данные из ваших записей</p>
